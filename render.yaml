# Render blueprint — https://render.com/docs/blueprint-spec
# In the Render dashboard: New > Blueprint, point it at this repo. It creates the
# service below; you then fill in MONGODB_URI (marked sync:false) before the first
# deploy finishes.
services:
  - type: web
    name: priority-backlog-tracker
    runtime: docker
    plan: free
    region: singapore            # closest Render region to Atlas ap-south-1 (Mumbai)
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    autoDeploy: true             # redeploy on every push to the default branch
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: MONGO_TRANSACTIONS_ENABLED
        value: "true"
      - key: JWT_SECRET
        generateValue: true       # Render generates a strong value once and keeps it
      - key: MONGODB_URI
        sync: false               # secret — set it in the dashboard, no trailing /database
      # First-boot admin: uncomment, set values, deploy, log in, then re-comment + redeploy.
      # - key: SEED_USER_ENABLED
      #   value: "true"
      # - key: SEED_USER_EMAIL
      #   sync: false
      # - key: SEED_USER_PASSWORD
      #   sync: false
      # - key: SEED_USER_NAME
      #   value: "Kaushik"
      # - key: SEED_USER_CODE
      #   value: "KM"
