spring:
  application:
    name: priority-backlog-tracker
  data:
    mongodb:
      database: backlog
      # Create the @Indexed / @CompoundIndex definitions on startup (unique email,
      # userCode, itemId; the scope/status/owner compound indexes).
      auto-index-creation: true
      # No host/uri set: the embedded MongoDB (flapdoodle) is used for local dev and
      # tests. Production sets MONGODB_URI and runs with --spring.profiles.active=prod
      # (application-prod.yml), which disables the embedded server.

server:
  port: ${PORT:8080}

# Embedded MongoDB version for local dev and tests (flapdoodle). Ignored in production
# once MONGODB_URI points at Atlas and the embedded auto-config is disabled.
de:
  flapdoodle:
    mongodb:
      embedded:
        version: 7.0.12

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      probes:
        enabled: true

app:
  jwt:
    secret: ${JWT_SECRET:test123}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:1440}
  # Seed a realistic sample backlog on startup. Off by default; the `demo` profile
  # (application-demo.yml) turns it on. Idempotent — skips if items already exist.
  demo-data:
    enabled: ${DEMO_DATA_ENABLED:false}
  mongo:
    transactions:
      # true only against a replica set / Atlas — makes the §24 archive move atomic
      enabled: ${MONGO_TRANSACTIONS_ENABLED:false}
  # On an empty DB, create a fixed ADMIN account (test123/test123) so local runs,
  # the demo profile and the test suite can sign in. Turned OFF in prod, where the
  # admin already exists. No SEED_USER_* knobs.
  local-bootstrap:
    enabled: true
