spring:
  application:
    name: priority-backlog-tracker
  data:
    mongodb:
      database: backlog
      # No host/uri set: the embedded MongoDB (flapdoodle) is used for local dev and
      # tests. Production overrides this by setting MONGODB_URI (wired at the deploy step).

server:
  port: ${PORT:8080}

# Embedded MongoDB version for local dev and tests (flapdoodle). Ignored in production
# once MONGODB_URI points at Atlas and the embedded auto-config is disabled.
de:
  flapdoodle:
    mongodb:
      embedded:
        version: 7.0.12

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      probes:
        enabled: true

app:
  jwt:
    secret: ${JWT_SECRET:test123}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:1440}
  # Dev seed account (design has no real founder data yet). Override in production.
  seed-user:
    enabled: ${SEED_USER_ENABLED:true}
    email: ${SEED_USER_EMAIL:test123}
    password: ${SEED_USER_PASSWORD:test123}
    name: ${SEED_USER_NAME:Test User}
    user-code: ${SEED_USER_CODE:TST}
