spring:
  application:
    name: priority-backlog-tracker

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      probes:
        enabled: true

# Placeholder for later steps. Local dev will use an embedded MongoDB (step 1);
# production points MONGODB_URI at Atlas M0.
app:
  jwt:
    secret: ${JWT_SECRET:test123}
