# Production profile — run with:  java -jar app.jar --spring.profiles.active=prod
#
# Config comes from ONE of:
#   * env vars (MONGODB_URI, JWT_SECRET, ...)  — the way to do it on Render / any host
#   * ./config/prod.properties                 — a gitignored local file you fill in
#                                                (copy it from config/prod.properties.example)
# The local file, when present, wins over the env-var defaults below. Run from the
# project root so the relative path resolves.
#
# Uses the `prod` database on the cluster MONGODB_URI points at. The `dev` profile
# points the same URI at the `dev` database instead, so one cluster holds both — see
# application-dev.yml. Give MONGODB_URI no trailing /database; the name below wins.
spring:
  config:
    import: "optional:file:./config/prod.properties"
  data:
    mongodb:
      uri: ${MONGODB_URI}
      database: ${MONGO_DB:prod}
  autoconfigure:
    # never start the embedded MongoDB in production, even though the jar bundles it
    exclude:
      - de.flapdoodle.embed.mongo.spring.autoconfigure.EmbeddedMongoAutoConfiguration

app:
  demo-data:
    enabled: false
  mongo:
    transactions:
      enabled: true # Atlas is a replica set — makes the archive move (§24) atomic
  # No local bootstrap in prod — the admin account already exists and is promoted to
  # ADMIN/ACTIVE by LegacyDataMigration. New accounts come only from /api/auth/register.
  local-bootstrap:
    enabled: false
