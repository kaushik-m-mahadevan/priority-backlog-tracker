# Activate with: --spring.profiles.active=demo
#
# Sample-data toggle only. Layers on top of whatever MongoDB is already configured:
#   (no other profile) -> embedded MongoDB, offline, sample data      [demo]
#   with `dev`         -> Atlas backlog_dev database, sample data     [dev,demo] (redundant: dev already seeds)
# For a shared Atlas cluster with a real prod database, use the `dev` profile instead.
app:
  demo-data:
    enabled: true
