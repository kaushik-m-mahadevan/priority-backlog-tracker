name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build, typecheck and test
        run: ./mvnw -B clean verify

      - name: Frontend typecheck
        working-directory: src/main/frontend
        run: ./node/node node_modules/typescript/lib/tsc.js -p tsconfig.json --noEmit

      - name: Frontend unit tests
        working-directory: src/main/frontend
        run: ./node/node node_modules/vitest/vitest.mjs run

      - name: Install Playwright browser
        working-directory: src/main/frontend
        run: ./node/node node_modules/@playwright/test/cli.js install chromium --with-deps

      - name: End-to-end smoke suite
        working-directory: src/main/frontend
        env:
          CI: "true"
        run: ./node/node node_modules/@playwright/test/cli.js test
